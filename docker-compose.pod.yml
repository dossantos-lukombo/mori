version: "3.8"

services:
  go-backend:
    image: docker.io/${DOCKERHUB_USERNAME}/mori-backend:latest
    environment:
      - RATE_LIMIT_ENABLED=true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:8081"

  llm-server:
    image: docker.io/${DOCKERHUB_USERNAME}/mori-llm-server:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"

  frontend:
    image: docker.io/${DOCKERHUB_USERNAME}/mori-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
