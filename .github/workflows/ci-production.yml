      #   run: |
      #     # Commandes pour démarrer votre application en arrière-plan
      #     echo "Starting application..."
      #     # Exemple: docker-compose up -d
      #     # Attendre que l'application soit prête

      # - name: OWASP ZAP Full Scan
      #   uses: zaproxy/action-full-scan@v0.10.0
      #   with:
      #     target: 'http://localhost:8080' # Remplacez par l'URL de votre application de test
      #     # cmd_options: '-addoninstall all' # Optionnel: installer tous les add-ons
      #     # fail_action: true # Optionnel: faire échouer l'action si des alertes sont trouvées

  # Job pour l'analyse des dépendances
  dependency_analysis:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Exemple avec Snyk (nécessite une clé API Snyk)
      # - name: Snyk Security Scan
      #   uses: snyk/actions/golang@master # Adaptez le langage
      #   env:
      #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      #   with:
      #     args: --severity-threshold=high # Faire échouer pour les vulnérabilités de haute sévérité

      # Activez Dependabot directement dans les paramètres de votre dépôt GitHub
      # ou utilisez une action pour d'autres outils comme Trivy, etc.
      - name: Placeholder for Dependency Scan
        run: echo "Dependency scan step placeholder"

  # Job de déploiement sur Scaleway
  deploy_to_scaleway:
    needs: [build_and_test, integration_tests, performance_tests, security_scan, dependency_analysis, semver_and_tag] # Dépend de tous les jobs de CI et du tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_API_KEY }}

      - name: Build and push Docker image
        run: |
          # Utilisez le tag SemVer généré par le job semver_and_tag
          IMAGE_TAG=${{ needs.semver_and_tag.outputs.tag }}
          docker build -t ${{ secrets.SCW_REGISTRY_ENDPOINT }}/monapp:${IMAGE_TAG} . # Remplacez 'monapp' par le nom de votre image
          docker push ${{ secrets.SCW_REGISTRY_ENDPOINT }}/monapp:${IMAGE_TAG}

      - name: Deploy to Scaleway Container
        uses: scaleway/scaleway-container-deploy-action@v1
        with:
          access_key: ${{ secrets.SCW_ACCESS_KEY }}
          secret_key: ${{ secrets.SCW_SECRET_KEY }}
          image: ${{ secrets.SCW_REGISTRY_ENDPOINT }}/monapp:${{ needs.semver_and_tag.outputs.tag }} # Utilisez le tag SemVer
          service_name: monapp-service # Remplacez par le nom de votre service Scaleway
          # region: fr-par # Optionnel: spécifiez la région
          # max_concurrency: 50 # Optionnel: configurez la concurrence max
          # min_scale: 0 # Optionnel: configurez le scale min
          # max_scale: 10 # Optionnel: configurez le scale max
          # timeout: 300 # Optionnel: configurez le timeout
          # env_vars: | # Optionnel: configurez les variables d'environnement
          #   MY_VAR=my_value
          #   ANOTHER_VAR=another_value