# .github/workflows/cd-production.yml
name: CD Production

on:
  push:
    branches: [ production ]

jobs:
  # 1. Build Check (Dockerfile lint + build dry-run)
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Dockerfile Lint
        uses: hadolint/hadolint-action@v2 :contentReference[oaicite:21]{index=21}
      - name: Build image (no cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: prod/app:latest :contentReference[oaicite:22]{index=22}

  # 2. Healthcheck automatisé
  healthcheck:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run container for healthcheck
        run: |
          docker run -d --name prod-test -p 8080:8080 prod/app:latest
          docker run --network container:prod-test jwilder/dockerize \
            -wait http://localhost:8080/health -timeout 60s :contentReference[oaicite:23]{index=23}
          docker rm -f prod-test

  # 3. Scans de sécurité critiques OWASP ZAP
  prod-zap:
    needs: healthcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Critical OWASP Full Scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: 'http://localhost:8080' :contentReference[oaicite:24]{index=24}

  # 4. Tests d’intégrité post-build
  integrity:
    needs: prod-zap
    runs-on: ubuntu-latest
    steps:
      - name: Verify DB Connectivity
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          python - <<EOF
          import psycopg2, os
          conn=psycopg2.connect(os.getenv('DB_URL'))
          print(conn.cursor().execute('SELECT 1'))
          conn.close()
          EOF :contentReference[oaicite:25]{index=25}

  # 5. Génération et push du tag sémantique
  release:
    needs: integrity
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Semantic Release (Conventional Commits)
        uses: anitvam/conventionalcommit-semantic-releasing@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }} :contentReference[oaicite:26]{index=26}

  # 6. Push de l’image vers le registry
  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/app:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/app:latest :contentReference[oaicite:27]{index=27}
