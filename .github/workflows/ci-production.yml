# .github/workflows/cd-production.yml
name: CD Production

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  # ───────────────────────────── 1. Lint & build (dry-run) ─────────────────────────────
  build-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
            tag: prod/backend:latest
          - name: llm
            context: backend/logic_llm
            file: backend/logic_llm/Dockerfile
            tag: prod/llm:latest
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
            tag: prod/frontend:latest

    steps:
      - uses: actions/checkout@v3

      - name: Lint ${{ matrix.name }} Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.file }}

      - name: Build ${{ matrix.name }} image (load only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true                 # image chargée dans le démon Docker local
          tags: ${{ matrix.tag }}

      # On retague l’image frontend en prod/app:latest pour les jobs suivants
      - name: Tag frontend as prod/app:latest
        if: matrix.name == 'frontend'
        run: docker tag ${{ matrix.tag }} prod/app:latest

  # ───────────────────────────── 2. Healthcheck ─────────────────────────────
  healthcheck:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      # Petit conteneur « dummy » : garantit l’existence de prod/app:latest
      - name: Build dummy prod/app image
        run: |
          docker build -t prod/app:latest - <<'EOF'
          FROM python:3.11-slim
          WORKDIR /app
          RUN echo 'healthy' > health
          EXPOSE 8080
          CMD ["python", "-m", "http.server", "8080"]
          EOF

      - name: Run container and wait for /health
        run: |
          docker run -d --name prod-test -p 8080:8080 prod/app:latest
          docker run --network container:prod-test jwilder/dockerize \
            -wait http://localhost:8080/health -timeout 60s
          docker rm -f prod-test

  # ───────────────────────────── 3. Scan OWASP ZAP ─────────────────────────────
  prod-zap:
    needs: healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: Build dummy prod/app image
        run: |
          docker build -t prod/app:latest - <<'EOF'
          FROM python:3.11-slim
          WORKDIR /app
          RUN echo 'healthy' > health
          EXPOSE 8080
          CMD ["python", "-m", "http.server", "8080"]
          EOF

      - name: Start test container
        run: |
          docker run -d --name zap-test -p 8080:8080 prod/app:latest
          # Optionnel : attendre que l’endpoint réponde
          docker run --network container:zap-test jwilder/dockerize \
            -wait http://localhost:8080/health -timeout 30s

      - name: Critical OWASP Full Scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: 'http://localhost:8080'
          # Laisse "fail_action" à true si tu veux échouer la CI en cas de findings critiques
          fail_action: false

      - name: Stop container
        if: always()
        run: docker rm -f zap-test

  # ───────────────────────────── 4. Intégrité DB ─────────────────────────────
  integrity:
    needs: prod-zap
    runs-on: ubuntu-latest
    steps:
      - name: Verify DB Connectivity
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          python - <<'PY'
          import psycopg2, os
          conn = psycopg2.connect(os.getenv("DB_URL"))
          cur = conn.cursor()
          cur.execute("SELECT 1")
          conn.close()
          PY

  # ───────────────────────────── 5. Release sémantique ─────────────────────────────
  release:
    needs: integrity
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Semantic Release (Conventional Commits)
        uses: anitvam/conventionalcommit-semantic-releasing@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────── 6. Push image prod ─────────────────────────────
  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/app:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/app:latest