# .github/workflows/cd-production.yml
name: CD Production

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

jobs:
  # 1. Build Check (Dockerfile lint + build dry-run)
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Lint Backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./backend/Dockerfile

      - name: Lint LLM Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./backend/logic_llm/Dockerfile

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./frontend/Dockerfile


      - name: Build image (no cache)
        uses: docker/build-push-action@v6
        with:
          context: .               # racine du repo (docker-compose.yml y est)
          push: false
          tags: prod/app:latest

  # 2. Healthcheck automatisé
  healthcheck:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Run container for healthcheck
        run: |
          docker run -d --name prod-test -p 8080:8080 prod/app:latest
          docker run --network container:prod-test jwilder/dockerize \
            -wait http://localhost:8080/health -timeout 60s
          docker rm -f prod-test

  # 3. Scans de sécurité critiques OWASP ZAP
  prod-zap:
    needs: healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: Critical OWASP Full Scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: 'http://localhost:8080'

  # 4. Tests d’intégrité post-build
  integrity:
    needs: prod-zap
    runs-on: ubuntu-latest
    steps:
      - name: Verify DB Connectivity
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          python - <<EOF
          import psycopg2, os
          conn = psycopg2.connect(os.getenv("DB_URL"))
          cur = conn.cursor()
          cur.execute("SELECT 1")
          conn.close()
          EOF

  # 5. Génération et push du tag sémantique
  release:
    needs: integrity
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Semantic Release (Conventional Commits)
        uses: anitvam/conventionalcommit-semantic-releasing@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # 6. Push de l’image vers le registry
  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/app:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/app:latest
