name: Lint Conventional Commits

# On déclenche sur push et PR vers nos branches cibles
on:
  push:
    branches:
      - 'feature/**/*'
      - 'bugfix/**/*'
      - 'hotfix/**/*'
      - 'release/**/*'
      - 'chore/**/*'
      - 'docs/**/*'
      - 'refactor/**/*'
      - 'perf/**/*'
      - 'test/**/*'
      - 'develop_stable'
      - 'production'
  pull_request:
    branches:
      - 'develop_stable'
      - 'production'

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v3
        with:
          fetch-depth: 1            # nécessaire pour lire tous les commits :contentReference[oaicite:2]{index=2}
      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Installer Commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Linter les commits
        run: 
          # Pour les PR, on compare base→head ; en push, on inclut tous les nouveaux commits
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
          else
            npx commitlint --from HEAD~${{ github.event.commits | length }} --to HEAD --verbose
          fi
