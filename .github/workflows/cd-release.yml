# .github/workflows/cd-release.yml
name: CD Release

on:
  push:
    branches: [ 'release/**' ]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN:    ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v3

      # 1️⃣ Extract version from branch name
      - name: Get version
        run: echo "VERSION=${GITHUB_REF#refs/heads/release/}" >> $GITHUB_ENV

      # 2️⃣ Tag Github Release
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          release_name: v${{ env.VERSION }}
          draft: false
          prerelease: false

      # 3️⃣ Log in to Docker Hub
      - name: Docker-hub login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # 4️⃣ Build & push each image with version tag + latest
      - name: Push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mori-backend:v${{ env.VERSION }}
            ${{ env.DOCKERHUB_USERNAME }}/mori-backend:latest

      - name: Push llm
        uses: docker/build-push-action@v6
        with:
          context: backend/logic_llm
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mori-llm:v${{ env.VERSION }}
            ${{ env.DOCKERHUB_USERNAME }}/mori-llm:latest

      - name: Push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mori-frontend:v${{ env.VERSION }}
            ${{ env.DOCKERHUB_USERNAME }}/mori-frontend:latest
