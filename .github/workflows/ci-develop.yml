# .github/workflows/ci-develop.yml
name: CI Develop

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  # ── 1) Build & Unit Tests ──────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v3

      # Go
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Run Go tests
        working-directory: backend
        run: go test ./... -v

      # Python / LLM
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Install LLM dependencies
        working-directory: backend/logic_llm
        run: poetry install --no-root --with test

      - name: Run LLM tests
        working-directory: backend/logic_llm
        run: poetry run pytest --maxfail=1 --disable-warnings -q

      # Frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ── 2) Smoke Test Backend ──────────────────────────
  smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Démarre juste le back dans Docker, on mock le reste
      - name: Build Go-backend image
        run: |
          docker build -t mori/backend:dev ./backend

      - name: Run Go-backend & healthcheck
        run: |
          docker run -d --name smoke-backend -p 8081:8081 mori/backend:dev
          for i in {1..10}; do
            if curl -fs http://localhost:8081/health; then
              echo "✅ Go-backend OK" && break
            fi
            echo "⏳ Waiting…" && sleep 2
          done
          docker rm -f smoke-backend
