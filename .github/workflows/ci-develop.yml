# .github/workflows/ci-develop_stable.yml
name: CI Develop Stable

on:
  push:
    branches:
      - test_ci_cd
  pull_request:
    types: 
      - closed
    branches:
      - test_ci_cd

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_USER:               ${{ secrets.DB_USER }}
      DB_PASSWORD:           ${{ secrets.DB_PASSWORD }}
      DB_NAME:               ${{ secrets.DB_NAME }}
      ACCESS_SECRET_KEY_LLM:  ${{ secrets.ACCESS_SECRET_KEY_LLM }}
      REFRESH_SECRET_KEY_LLM: ${{ secrets.REFRESH_SECRET_KEY_LLM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Préparer backend/.env pour Compose
        run: |
          cat <<EOF > backend/.env
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_SSLMODE=disable
          RATE_LIMIT_ENABLED=false
          ACCESS_SECRET_KEY_LLM=${{ secrets.ACCESS_SECRET_KEY_LLM }}
          REFRESH_SECRET_KEY_LLM=${{ secrets.REFRESH_SECRET_KEY_LLM }}
          EOF

      - name: Docker Compose up (Postgres + Go + LLM + Front)
        run: docker compose -f docker-compose.yml up -d --build

      - name: Attendre Go-backend (/health)
        run: |
          for i in {1..10}; do
            if curl -fs http://localhost:8081/health; then
              echo "Go-backend est prêt !" && exit 0
            fi
            echo "Attente Go-backend…"
            sleep 2
          done
          echo "❌ Le Go-backend n'a pas démarré dans les temps" && exit 1

      - name: Attendre LLM-server (/health)
        run: |
          for i in {1..10}; do
            if curl -fs http://localhost:3000/health; then
              echo "LLM-server est prêt !" && exit 0
            fi
            echo "Attente LLM-server…"
            sleep 2
          done
          echo "❌ Le LLM-server n'a pas démarré dans les temps" && exit 1

      - name: Attendre Frontend (/health)
        run: |
          for i in {1..10}; do
            if curl -fs http://localhost:8080/health; then
              echo "Frontend est prêt !" && exit 0
            fi
            echo "Attente Frontend…"
            sleep 2
          done
          echo "❌ Le Frontend n'a pas démarré dans les temps" && exit 1

      - name: Docker Compose down
        run: docker compose -f docker-compose.yml down -v

      # ────────────────────────────────────────────────────────────
      # 🔑 Connexion à Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ────────────────────────────────────────────────────────────
      # ⚙️ Build & push Backend
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mori_dev_repo:backend

      # ⚙️ Build & push Frontend
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mori_dev_repo:frontend

      # ⚙️ Build & push LLM-server
      - name: Build and push llm-server image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/logic_llm
          dockerfile: Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mori_dev_repo:llm-server

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:          ${{ secrets.DATABASE_URL }}
      ACCESS_SECRET_KEY_LLM:  ${{ secrets.ACCESS_SECRET_KEY_LLM }}
      REFRESH_SECRET_KEY_LLM: ${{ secrets.REFRESH_SECRET_KEY_LLM }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Create .env file pour LLM tests
        run: |
          cat <<EOF > backend/logic_llm/.env
          ACCESS_SECRET_KEY_LLM=${{ secrets.ACCESS_SECRET_KEY_LLM }}
          REFRESH_SECRET_KEY_LLM=${{ secrets.REFRESH_SECRET_KEY_LLM }}
          EOF

      # Installer Poetry
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      # Installer toutes les dépendances, y compris FastAPI
      - name: Install project dependencies
        working-directory: backend/logic_llm
        run: poetry install --with test

      - name: Run Python tests (FastAPI / LLM)
        working-directory: backend/logic_llm
        run: poetry run pytest test/ --maxfail=1 --disable-warnings -q

      - name: Setup Go (pour tests backend)
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Run Go-backend tests
        working-directory: backend
        run: go test ./test -v

  smoke:
    needs: test
    runs-on: ubuntu-latest
    env:
      DB_USER:               ${{ secrets.DB_USER }}
      DB_PASSWORD:           ${{ secrets.DB_PASSWORD }}
      DB_NAME:               ${{ secrets.DB_NAME }}
      ACCESS_SECRET_KEY_LLM:  ${{ secrets.ACCESS_SECRET_KEY_LLM }}
      REFRESH_SECRET_KEY_LLM: ${{ secrets.REFRESH_SECRET_KEY_LLM }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Création du .env racine pour Compose
        run: |
          cat <<EOF > .env
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_SSLMODE=disable
          RATE_LIMIT_ENABLED=false
          EOF

      - name: Générer backend/.env pour Compose
        run: |
          mkdir -p backend
          cat <<EOF > backend/.env
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_SSLMODE=disable
          RATE_LIMIT_ENABLED=false
          ACCESS_SECRET_KEY_LLM=${{ secrets.ACCESS_SECRET_KEY_LLM }}
          REFRESH_SECRET_KEY_LLM=${{ secrets.REFRESH_SECRET_KEY_LLM }}
          EOF

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest images
        run: |
          docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mori_dev_repo:frontend
          docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mori_dev_repo:backend
          docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mori_dev_repo:llm-server

      - name: Docker Compose up (avec les images)
        run: docker compose -f docker-compose.yml up -d --build

      - name: Attendre Go-backend (/health)
        run: |
          for i in {1..10}; do
            if curl -fs http://localhost:8081/health; then
              echo "Go-backend est prêt !" && exit 0
            fi
            echo "Attente Go-backend…"
            sleep 2
          done
          echo "❌ Le Go-backend n'a pas démarré dans les temps" && exit 1

      - name: Attendre LLM-server (/health)
        run: |
          for i in {1..10}; do
            if curl -fs http://localhost:3000/health; then
              echo "LLM-server est prêt !" && exit 0
            fi
            echo "Attente LLM-server…"
            sleep 2
          done
          echo "❌ Le LLM-server n'a pas démarré dans les temps" && exit 1

      - name: Attendre Frontend (/health)
        run: |
          for i in {1..10}; do
            if curl -fs http://localhost:8080/health; then
              echo "Frontend est prêt !" && exit 0
            fi
            echo "Attente Frontend…"
            sleep 2
          done
          echo "❌ Le Frontend n'a pas démarré dans les temps" && exit 1

      - name: Cleanup
        run: docker compose -f docker-compose.yml down -v
