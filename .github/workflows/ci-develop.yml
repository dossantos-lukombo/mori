# .github/workflows/ci-develop_stable.yml
name: CI Develop Stable

on:
  push:
    branches:
      - test_ci

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io      # optionnel, Docker Hub par défaut
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (CI)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: false
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mori-backend:develop


  # 2. Tests unitaires & d'intégration (pytest-postgresql example)
  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    # services:
    #   postgres:
    #     image: postgres:14.14
    #     env:
    #       POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
    #       POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    #       # POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd "pg_isready -U postgres"
    #       --health-interval=20s
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Installer Poetry
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      # Installer toutes les dépendances, y compris FastAPI
      - name: Install project dependencies
        run: |
          cd backend/logic_llm
          poetry install --no-root
          poetry env activate

      - name: Run tests
        run: pytest . --maxfail=1 --disable-warnings -q
  # 3. Smoke Test basique
  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
     # 1️⃣ Auth sur Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io       # optionnel, Docker Hub par défaut
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2️⃣ (Optionnel) Pull explicite
      - name: Pull latest image
        run: docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mori-backend:develop
      - name: Smoke test
        run: |
          docker run --rm docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mori-backend:develop sh -c "curl -f http://localhost:8080/health || exit 1"
  # 4. Scans de sécurité OWASP ZAP
  zap:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Baseline OWASP ZAP Scan
        uses: zaproxy/action-baseline-scan@v0.4.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: .zap/baseline-rules.tsv

      - name: Full OWASP ZAP Scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: 'http://localhost:8080'
  # 5. Tests de performance k6
  perf:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up k6
        uses: grafana/setup-k6-action@v0.1.0

      - name: Run k6 Performance Tests
        uses: grafana/run-k6-action@v1.0.0
        with:
          filename: tests/load-test.js
  # 6. Monitorage des métriques GitHub Actions
