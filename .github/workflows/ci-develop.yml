# .github/workflows/ci-develop_stable.yml
name: CI Develop Stable

on:
  push:
    branches:
      - test_ci

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_USER:     ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME:     ${{ secrets.DB_NAME }}
      ACCESS_SECRET_KEY_LLM:  ${{ secrets.ACCESS_SECRET_KEY_LLM }}
      REFRESH_SECRET_KEY_LLM: ${{ secrets.REFRESH_SECRET_KEY_LLM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Create backend/.env for Compose
        run: |
          cat <<EOF > backend/.env
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_SSLMODE=disable
          ACCESS_SECRET_KEY_LLM=${{ secrets.ACCESS_SECRET_KEY_LLM }}
          REFRESH_SECRET_KEY_LLM=${{ secrets.REFRESH_SECRET_KEY_LLM }}
          EOF


      # 1️⃣ Builder et démarrer la stack locale
      - name: Docker Compose up
        run: |
          # remplace par ton fichier compose local ou un override dédié
          docker compose -f docker-compose.yml up -d --build

      # 2️⃣ Attendre et tester LLM-server
      - name: Wait for LLM-server (port 3000)
        run: |
          for i in {1..10}; do
            if curl -fs http://localhost:3000/health; then
              echo "✅ LLM-server ready" && break
            fi
            echo "⏳ Waiting for LLM-server…" && sleep 2
          done

      # 3️⃣ Attendre et tester Go-backend
      - name: Wait for Go-backend (port 8081)
        run: |
          for i in {1..10}; do
            if curl -fs http://localhost:8081/health; then
              echo "✅ Go-backend ready" && break
            fi
            echo "⏳ Waiting for Go-backend…" && sleep 2
          done

      # 4️⃣ Tester Postgres
      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            if docker exec $(docker ps -qf "name=postgres") pg_isready -U ${{ secrets.DB_USER }}; then
              echo "✅ Postgres ready" && break
            fi
            echo "⏳ Waiting for Postgres…" && sleep 2
          done

      # 5️⃣ Teardown de la stack locale avant la suite
      - name: Docker Compose down
        run: docker compose -f docker-compose.yml down

      # 6️⃣ (Optionnel) Connexion à Docker Hub pour push d’images
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7️⃣ Build & push de ton image Go-backend
      - name: Build and push image (CI)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mori-backend:develop

  # 2. Tests unitaires & d'intégration (pytest-postgresql example)
  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCESS_SECRET_KEY_LLM: ${{ secrets.ACCESS_SECRET_KEY_LLM }}
      REFRESH_SECRET_KEY_LLM: ${{ secrets.REFRESH_SECRET_KEY_LLM }}
    # services:
    #   postgres:
    #     image: postgres:14.14
    #     env:
    #       POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
    #       POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    #       # POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd "pg_isready -U postgres"
    #       --health-interval=20s
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'


      - name: Create .env file
        run: |
          cat <<EOF > backend/logic_llm/.env
          ACCESS_SECRET_KEY_LLM=${{ secrets.ACCESS_SECRET_KEY_LLM }}
          REFRESH_SECRET_KEY_LLM=${{ secrets.REFRESH_SECRET_KEY_LLM }}
          EOF

      # Installer Poetry
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      # Installer toutes les dépendances, y compris FastAPI
      - name: Install project dependencies
        working-directory: backend/logic_llm
        run: |
          poetry install --with test
      - name: Run tests
        working-directory: backend/logic_llm
        run: poetry run pytest test/ --maxfail=1 --disable-warnings -q

      - name: Setup Go (for backend tests)
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Run Go-backend tests
        working-directory: backend
        run: |
          go test ./test -v

  # 3. Smoke Test basique
  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mori_dev_repo:develop

      - name: Start app container
        run: |
          # on génère un .env identique à celui utilisé en dev/local
          cat <<EOF > .env
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_SSLMODE=disable
          ACCESS_SECRET_KEY_LLM=${{ secrets.ACCESS_SECRET_KEY_LLM }}
          REFRESH_SECRET_KEY_LLM=${{ secrets.REFRESH_SECRET_KEY_LLM }}
          EOF
          docker run --rm --name smoke \
            -p 8081:8081 \
            --env-file .env \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mori_dev_repo:develop

      - name: Wait for service
        run: |
          for i in {1..10}; do
            if curl -fs http://localhost:8081/health; then
              echo "Service is up!" && exit 0
            fi
            echo "Waiting for service…"
            sleep 2
          done
          echo "❌ Service did not start in time" && exit 1

      - name: Cleanup
        run: docker rm -f smoke
    
  # 4. Scans de sécurité OWASP ZAP
  zap:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Baseline OWASP ZAP Scan
        uses: zaproxy/action-baseline-scan@v0.4.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: .zap/baseline-rules.tsv

      - name: Full OWASP ZAP Scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: 'http://localhost:8080'
  # 5. Tests de performance k6
  perf:
    needs: zap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up k6
        uses: grafana/setup-k6-action@v0.1.0

      - name: Run k6 Performance Tests
        uses: grafana/run-k6-action@v1.0.0
        with:
          filename: tests/load-test.js
