name: CD – Build & Déploiement Production

on:
  pull_request:
    types:
      - closed
    branches:
      - production

jobs:
  build-push-deploy:
    # Ne se lance que si la PR vers production a été merged
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      SCW_SSH_HOST: ${{ secrets.SCW_SSH_HOST }}
      SCW_SSH_USER: ${{ secrets.SCW_SSH_USER }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0      # pour récupérer l’historique complet et les tags

      - name: Mettre en place Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Récupérer tous les tags Git
        run: git fetch --tags

      - name: Déterminer la version la plus récente
        id: get_version
        run: |
          VERSION=$(git describe --tags "$(git rev-list --tags --max-count=1)")
          echo "Version trouvée : $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build & Push – Backend
        run: |
          docker build -t $DOCKERHUB_USERNAME/mori-backend:$VERSION ./backend
          docker push $DOCKERHUB_USERNAME/mori-backend:$VERSION

      - name: Build & Push – LLM Server
        run: |
          docker build -t $DOCKERHUB_USERNAME/mori-llm-server:$VERSION ./llm-server
          docker push $DOCKERHUB_USERNAME/mori-llm-server:$VERSION

      - name: Build & Push – Frontend
        run: |
          docker build -t $DOCKERHUB_USERNAME/mori-frontend:$VERSION ./frontend
          docker push $DOCKERHUB_USERNAME/mori-frontend:$VERSION

      - name: Préparer la clé SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SCW_SSH_KEY }}

      - name: Déployer sur le VPS Scaleway
        run: |
          ssh -o StrictHostKeyChecking=no $SCW_SSH_USER@$SCW_SSH_HOST << 'EOF'
            cd /home/deploy/mori
            export DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME
            export IMAGE_TAG=$VERSION
            docker-compose pull
            docker-compose up -d
            docker image prune -f
          EOF

      - name: Créer la Release GitHub si nécessaire
        if: ${{ steps.get_version.outputs.VERSION != '' }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          body: |
            - Version : ${{ env.VERSION }}
            - Déployée automatiquement sur Scaleway
            - Consultez [CHANGELOG.md](CHANGELOG.md) pour le détail des modifications
