services:
  go-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mori-go-backend
    command: ["go", "run", "."]
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8081:8081"
    env_file:
      - backend/.env
    environment:
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - ACCESS_SECRET_KEY_LLM=${ACCESS_SECRET_KEY_LLM}
      - REFRESH_SECRET_KEY_LLM=${REFRESH_SECRET_KEY_LLM}
    restart: unless-stopped

  llm-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mori-llm-server
    working_dir: /app
    volumes:
      - ./backend/logic_llm:/app
    command: ["poetry", "run", "uvicorn", "server:app", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    env_file:
      - backend/.env
    environment:
      - DB_URL=${SUPABASE_DB_URL}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mori-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "serve"]
    ports:
      - "8080:8080"
    env_file:
      - backend/.env
    environment:
      - VUE_APP_API_URL=${API_URL}
    restart: unless-stopped