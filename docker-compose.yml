version: "3.8"
services:
  go-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mori-go-backend
    working_dir: /app
    ports:
      - "8081:8081"
    env_file:
      - ./backend/.env        # récupère tes secrets SSO LLM et ceux de Supabase
    environment:
      - ACCESS_SECRET_KEY_LLM=${ACCESS_SECRET_KEY_LLM}
      - REFRESH_SECRET_KEY_LLM=${REFRESH_SECRET_KEY_LLM}
      - DATABASE_URL=${DATABASE_URL}                          # URL PostgreSQL Supabase
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}# clé service-role pour opérations server-side
    restart: unless-stopped

  llm-server:
    build:
      context: ./backend
      dockerfile: ./logic_llm/Dockerfile
    container_name: mori-llm-server
    working_dir: /app
    volumes:
      - ./backend/logic_llm:/app/logic_llm
    command: ["poetry", "run", "uvicorn", "logic_llm.server:app", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: mori-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "serve"]
    ports:
      - "8080:8080"
    restart: unless-stopped
