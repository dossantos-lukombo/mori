services:
  go-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mori-go-backend
    # Remove the command override to use the one from Dockerfile
    working_dir: /app
    # Be careful with volumes as they can override the binary
    ports:
      - "8081:8081"
    env_file:
      - ./backend/.env
    environment:
      - ACCESS_SECRET_KEY_LLM=${ACCESS_SECRET_KEY_LLM}
      - REFRESH_SECRET_KEY_LLM=${REFRESH_SECRET_KEY_LLM}
    restart: unless-stopped

  llm-server:
    build:
      context: ./backend
      dockerfile: ./logic_llm/Dockerfile
    container_name: mori-llm-server
    working_dir: /app
    volumes:
      - ./backend/logic_llm:/app/logic_llm
    command: ["poetry", "run", "uvicorn", "logic_llm.server:app", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: mori-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "serve"]
    ports:
      - "8080:8080"

    restart: unless-stopped
